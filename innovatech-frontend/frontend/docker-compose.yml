version: "3.9"

services:
  # ─────────────────────────────────────────
  # Frontend React (Nginx)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        # URL del backend (EC2 privada o dominio)
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
    container_name: innovatech_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - frontend_net
    # Logs accesibles desde el host (bind mount)
    volumes:
      - ./logs/nginx:/var/log/nginx

# ─────────────────────────────────────────
# Redes
# ─────────────────────────────────────────
networks:
  frontend_net:
    driver: bridge

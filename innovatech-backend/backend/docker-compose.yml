version: '3.9'

services:

  db:
    image: postgres:15-alpine
    container_name: innovatech_db

    restart: always

    environment:
      POSTGRES_DB: innovatech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - backend_net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d innovatech"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s



  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: innovatech_backend

    restart: always

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: innovatech
      DB_USER: postgres
      DB_PASSWORD: postgres123

    networks:
      - backend_net



networks:
  backend_net:
    driver: bridge



volumes:
  postgres_data: